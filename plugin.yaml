manifest_version: 1
name: mindgraph
version: 1.0.0
description: "MindGraph — typed knowledge-graph memory: bounded per-message recall, session transcript capture, and the full mindgraph-mcp tool surface (capture, reason, commit, plan, retrieve, remember, ingest, synthesize, ontology)."
author: Shan Rizvi
requires_hermes: ">=0.22.0"

requires_env:
  - name: MINDGRAPH_API_KEY
    description: "MindGraph API key"
    url: "https://mindgraph.cloud"
    secret: true

hooks:
  - on_turn_start
  - on_session_end
  - on_session_switch
  - on_pre_compress
  - on_memory_write

# Optional (not prompted; set in the profile's .env):
#   MINDGRAPH_BASE_URL      API endpoint (default https://api.mindgraph.cloud)
#   MINDGRAPH_AGENT_ID      provenance tag on writes (default hermes)
#   MINDGRAPH_ORG_ID        org header for multi-org keys
#   MINDGRAPH_GOVERNANCE    "off" skips the per-call governance checkpoint
#   MINDGRAPH_AUTO_CAPTURE  "off" stops automatic transcript ingestion
