[project]
name = "hermes-mindgraph"
version = "1.0.0"
description = "Hermes Agent memory provider plugin: MindGraph"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes environment by `hermes plugins install` / `enable`.
# Upper bounds keep the plugin resolvable against Hermes's exact pins.
dependencies = [
    "mindgraph-sdk>=0.16.0,<0.17",
    "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
