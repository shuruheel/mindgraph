[project]
name = "hermes-mindgraph"
version = "1.2.0"
description = "Hermes Agent memory provider plugin: MindGraph"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes environment by `hermes plugins install` / `enable`.
# Upper bounds keep the plugin resolvable against Hermes's exact pins.
dependencies = [
    "mindgraph-sdk>=0.17.0,<0.18",
    "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Explicit, so a newer ruff's defaults do not change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
# The SDK's import name is also this repository's name, so a checkout directory
# called "mindgraph" (CI) would otherwise sort the SDK as first-party and a
# differently named one (a local clone) as third-party.
known-third-party = ["mindgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
