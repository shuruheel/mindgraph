name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Hermes installs only [project].dependencies (the repo root is a plugin, not a wheel).
      - name: Install the declared dependencies
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
