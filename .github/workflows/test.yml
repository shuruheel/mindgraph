name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Hermes installs only [project].dependencies (the repo root is a plugin, not a wheel).
      - name: Install the declared dependencies
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt pytest ruff==0.15.5
      - run: ruff check .
      - run: python -m pytest -q

  # The plugin inside real Hermes: its loader, MemoryProvider ABC and
  # MemoryManager, at a pinned commit. Bump HERMES_REF deliberately; a failure
  # after a bump is an upstream contract change to port, not a flake.
  host:
    name: real Hermes host
    runs-on: ubuntu-latest
    env:
      HERMES_REF: ae1ff71c39d8527227400c8e71acf9c57a8a59c6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: .hermes-agent
      # Installed the way Hermes's own CI does it: the lockfile carries
      # overrides that a plain pip resolve of pyproject.toml cannot satisfy.
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its lockfile
        working-directory: .hermes-agent
        run: uv sync --locked --python 3.14
      - name: Add the plugin's declared dependencies under Hermes's pins
        run: |
          python3 -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/requirements.txt
          uv pip install --python .hermes-agent/.venv/bin/python -r /tmp/requirements.txt pytest
      - name: Run the host suite
        env:
          HERMES_HOST_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/.hermes-agent
        run: .hermes-agent/.venv/bin/python -m pytest tests/host -q
      # The admission gate the Hermes catalog runs on a re-pin (manifest, declared
      # vs registered capabilities, dependency declaration, install scanner),
      # against the committed tree exactly as the catalog would clone it.
      - name: Export the committed tree
        run: |
          mkdir -p "$RUNNER_TEMP/plugin/mindgraph"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/plugin/mindgraph"
      - name: Run Hermes's catalog validator
        working-directory: .hermes-agent
        run: .venv/bin/python -m hermes_cli.main plugins validate --install-deps "$RUNNER_TEMP/plugin/mindgraph"
